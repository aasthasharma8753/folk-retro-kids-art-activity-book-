<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- ============================================================
       SHARED SVG SPRITE — every recurring motif, activity icon,
       badge glyph and mascot in the book lives here as a <symbol>,
       so the same line-weight and style repeats everywhere via
       <svg class="motif"><use href="#motif-xxx"/></svg>.
       Style: thick clean outlines, simple folk-art-inspired shapes.
       ============================================================ -->

  <!-- ---------- RECURRING MOTIFS (viewBox 0 0 100 100) ---------- -->

  <symbol id="motif-lotus" viewBox="0 0 100 100">
